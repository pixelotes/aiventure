---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiventure
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: aiventure
  template:
    metadata:
      labels:
        app: aiventure
    spec:
      containers:
        - name: aiventure
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: ws
              containerPort: 8765
          env:
            - name: OLLAMA_URL
              value: {{ .Values.ollama.url | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.ollama.model | quote }}
            - name: OLLAMA_TIMEOUT
              value: {{ .Values.ollama.timeout | quote }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              subPath: saves
              mountPath: /app/saves
            - name: data
              subPath: stories
              mountPath: /app/stories
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aiventure-data
      {{- end }}
