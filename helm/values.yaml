---
replicaCount: 1

image:
  repository: pixelotes/aiventure
  tag: latest
  pullPolicy: Always

# Backend Ollama instance (assumes the in-cluster Ollama Helm release at the default service name).
ollama:
  url: http://ollama.ollama.svc.cluster.local:11434
  model: qwen3:0.6b
  timeout: 600

# Single port serves both HTTP (UI) and the WebSocket (path /ws).
service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: traefik
  host: aiventure.localhost

# Single PVC mounted twice via subPath: /app/saves and /app/stories live on the
# same volume but in separate directories.
persistence:
  enabled: true
  size: 1Gi
  storageClass: local-path

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
