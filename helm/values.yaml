---
replicaCount: 1

image:
  repository: pixelotes/aiventure
  tag: latest
  pullPolicy: Always

# Backend Ollama instance (assumes the in-cluster Ollama Helm release at the default service name).
ollama:
  url: http://ollama.ollama.svc.cluster.local:11434
  model: qwen3:0.6b
  timeout: 600

# The app listens on two ports (hardcoded in web_terminal.py):
#   8080 — HTTP UI
#   8765 — WebSocket (the browser connects directly to this from index.html)
service:
  type: ClusterIP
  httpPort: 8080
  wsPort: 8765

# Ingress for the HTTP UI only. The WebSocket port (8765) needs separate routing
# (e.g. `kubectl port-forward svc/aiventure 8765:8765`) because the client
# hardcodes the port in `ws://${hostname}:8765`.
ingress:
  enabled: false
  className: traefik
  host: aiventure.localhost

# Single PVC mounted twice via subPath: /app/saves and /app/stories live on the
# same volume but in separate directories.
persistence:
  enabled: true
  size: 1Gi
  storageClass: local-path

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
